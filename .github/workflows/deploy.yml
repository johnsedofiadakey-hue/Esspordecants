# Tests the API against the Firebase emulators, builds both sites and deploys to
# Firebase on every push to main. Authenticates to Google Cloud with Workload
# Identity Federation (no stored keys); the provider only trusts main of this repo.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT: esspordecants
  FIREBASE_TOOLS_VERSION: 15.18.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/*/package-lock.json

      # The Firebase emulators need Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install -g firebase-tools@${FIREBASE_TOOLS_VERSION}
          npm ci --prefix apps/api
          npm ci --prefix apps/admin
          npm ci --prefix apps/storefront

      - name: Typecheck and test API
        working-directory: apps/api
        run: |
          npm run typecheck
          npm test

      # Builds the storefront and walks the customer journey in headless Chrome (installed
      # on the runner), including a pretend Paystack payment, against the emulators.
      - name: Browser tests
        working-directory: apps/api
        run: npm run e2e

      - name: Build admin
        run: npm run build --prefix apps/admin

      # No VITE_API_BASE_URL: the build calls /api on its own domain.
      - name: Build storefront
        run: npm run build --prefix apps/storefront

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/148784388342/locations/global/workloadIdentityPools/github/providers/esspordecants-repo
          service_account: github-deployer@esspordecants.iam.gserviceaccount.com

      - name: Deploy to Firebase
        run: firebase deploy --only functions,hosting,firestore --project "$FIREBASE_PROJECT" --non-interactive
